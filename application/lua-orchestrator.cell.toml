name = "lua-orchestrator"
version = "0.1.0"
wasm = "lua-orchestrator.wasm"

provides = ["orchestrator.dispatch"]
consumes = [
    "routing.state.v1.route.set",
    "routing.state.v1.route.get",
    "routing.state.v1.route.delete",
    "routing.state.v1.route.list",
    "routing.state.v1.session.close",
    "routing.state.v1.negative.record",
    "routing.state.v1.negative.check",
    "routing.state.v1.negative.clear",
    "engine.http-json.v1.request",
    "edge.admission.v1.issue",
    "edge.admission.v1.consume",
    "edge.admission.v1.revoke",
]
depends_on = ["routing-state", "http-json", "edge-admission"]
capabilities = []

[config]
timeout_ms = 30000
