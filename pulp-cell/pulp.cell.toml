name = "udp-relay"
version = "0.1.0"
wasm = "peel.wasm"

provides = []
consumes = [
    "orchestrator.dispatch",
    "routing.state.v1.session.touch",
    "routing.state.v1.session.sweep",
    "routing.state.v1.snapshot.get",
]
depends_on = ["routing-state", "lua-orchestrator"]

capabilities = [
    "network.udp",
]

[config]
# UDP relay listen address — inbound player traffic
listen_addr = ":5520"

route_event = "peel.route.resolve.v1"
route_resolver_url = "http://localhost:3001/route-request"

# Socket read buffer size in bytes (8 MiB default)
buffer_size = 8388608

# Idle session timeout — sessions with no activity for this long are closed
idle_timeout = "10m"
